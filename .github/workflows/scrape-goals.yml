name: Scrape Goals

on:
  schedule:
    # Fixed daily checks, every day, year-round — no fixture data needed.
    # Saudi Pro League matches never kick off late at night, so three checks
    # spread across the typical match-end window catch new goals same-day
    # without needing to track individual fixtures. Times are Riyadh local
    # (UTC+3, no DST) converted to UTC.
    - cron: '30 12 * * *'  # 15:30 KSA
    - cron: '30 14 * * *'  # 17:30 KSA
    - cron: '30 16 * * *'  # 19:30 KSA
  workflow_dispatch:         # Manual trigger (always runs)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Time: $(date -u '+%A %H:%M UTC')"

      - name: Install dependencies
        run: npm ci

      - name: Install Patchright
        run: npx patchright install chromium

      - name: Run scraper
        run: npm run scrape

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            debug-screenshot.png
            debug-page.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/components/RoadSection.astro src/components/HeroSection.astro
          git diff --staged --quiet || git commit -m "Update goal data"
          git push
